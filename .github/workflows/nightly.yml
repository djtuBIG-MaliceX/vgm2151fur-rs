name: Nightly

# Every push to master rebuilds the four release binaries and replaces the
# assets on the moving "Nightly" release.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }} AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds: appimagetool then injects the matching runtime.
          # ubuntu-22.04 keeps the glibc floor low for the x86_64 AppImage.
          # `ubuntu-22.04-arm` matches the x86_64 glibc floor.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-linux-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked --bin vgm2fur

      - name: Assemble AppDir
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP="$PWD/AppDir"
          rm -rf "$APP"
          mkdir -p "$APP/usr/bin" \
                   "$APP/usr/share/applications" \
                   "$APP/usr/share/icons/hicolor/256x256/apps"
          install -m 755 target/release/vgm2fur "$APP/usr/bin/vgm2fur"

          cat > "$APP/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/vgm2fur" "$@"
          EOF
          chmod 755 "$APP/AppRun"

          cat > "$APP/vgm2151fur.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=vgm2151fur
          GenericName=VGM to Furnace converter
          Comment=Transcribe VGM/VGZ files into Furnace .fur modules
          Exec=vgm2fur
          Icon=vgm2151fur
          Terminal=true
          Categories=AudioVideo;Audio;
          Keywords=vgm;vgz;furnace;fur;chiptune;ym2151;ym2612;
          EOF

          # Simple generated icon (256×256, RGB stripes) so the AppImage has
          # a desktop entry Furnace users can recognise.
          python3 - <<'PY'
          import struct, zlib
          w = h = 256
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  band = ((x // 32) + (y // 32)) % 2
                  raw += bytes((255, 64, 160)) if band else bytes((48, 16, 72))
          def chunk(tag, data):
              body = tag + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', zlib.crc32(body) & 0xFFFFFFFF)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(bytes(raw), 9))
                 + chunk(b'IEND', b''))
          for path in ('AppDir/vgm2151fur.png',
                       'AppDir/usr/share/icons/hicolor/256x256/apps/vgm2151fur.png'):
              with open(path, 'wb') as fh:
                  fh.write(png)
          PY
          ln -sf vgm2151fur.png "$APP/.DirIcon"

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          # continuous appimagetool ships as an AppImage; extract it so the
          # build needs no FUSE inside the container.
          ./appimagetool --appimage-extract >/dev/null 2>&1 || true
          if [ -x squashfs-root/AppRun ]; then TOOL=./squashfs-root/AppRun; else TOOL=./appimagetool; fi
          "$TOOL" --no-appstream AppDir "vgm2fur-linux-${ARCH}.AppImage"
          # Smoke test: extract without FUSE and run the payload.
          rm -rf squashfs-root
          "./vgm2fur-linux-${ARCH}.AppImage" --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/vgm2fur --version | grep -F 'vgm2151fur 0.11.0'
          ls -l "vgm2fur-linux-${ARCH}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: vgm2fur-linux-${{ matrix.arch }}
          path: vgm2fur-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-windows

      - name: Build
        run: cargo build --release --locked --bin vgm2fur

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/vgm2fur.exe stage/
          Copy-Item README.md stage/
          Compress-Archive -Path stage/* -DestinationPath vgm2fur-windows-x86_64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vgm2fur-windows-x86_64
          path: vgm2fur-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    # `macos-14` is retired: the label resolves to a runner configuration the
    # hosted runners no longer offer. Build on the current Intel image and
    # cross-compile the arm64 slice, then lipo the pair into one binary.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-macos

      - name: Build both slices
        run: |
          set -euo pipefail
          cargo build --release --locked --bin vgm2fur --target aarch64-apple-darwin
          cargo build --release --locked --bin vgm2fur --target x86_64-apple-darwin

      - name: Merge into a universal binary
        run: |
          set -euo pipefail
          lipo -create \
            target/aarch64-apple-darwin/release/vgm2fur \
            target/x86_64-apple-darwin/release/vgm2fur \
            -output vgm2fur
          lipo -info vgm2fur
          lipo -info vgm2fur | grep -q 'x86_64 arm64'
          mkdir -p stage
          cp vgm2fur stage/
          cp README.md stage/
          tar -C stage -czf vgm2fur-macos-universal.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: vgm2fur-macos-universal
          path: vgm2fur-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Update Nightly release
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the Nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG=Nightly
          cat > notes.md <<EOF
          Automated nightly build of \`master\` @ ${SHA:0:12}.

          | Asset | Platform |
          | --- | --- |
          | \`vgm2fur-linux-x86_64.AppImage\` | Linux x86_64 (AppImage) |
          | \`vgm2fur-linux-aarch64.AppImage\` | Linux arm64 (AppImage) |
          | \`vgm2fur-windows-x86_64.zip\` | Windows x86_64 |
          | \`vgm2fur-macos-universal.tar.gz\` | macOS (x86_64 + arm64) |

          AppImages need FUSE; without it run them with
          \`--appimage-extract-and-run\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Move the lightweight tag to this commit so the release page
            # always points at the build it describes. If the tag is annotated
            # (older releases), fall back to recreating it.
            if ! gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" \
                 -f sha="$SHA" -F force=true >/dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes
              gh release create "$TAG" --title Nightly --prerelease \
                --target "$SHA" --notes-file notes.md
            else
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" --title Nightly --prerelease \
              --target "$SHA" --notes-file notes.md
          fi

          gh release upload "$TAG" dist/* --clobber
