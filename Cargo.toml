[package]
name = "vgm2151fur-rs"
version = "0.11.0"
edition = "2024"
description = "Transcribe every VGM into a Furnace .fur modules (Rust port of vgm2151fur 0.11.0)"
license = "MIT"

[lib]
name = "vgm2fur"
path = "src/lib.rs"

[[bin]]
name = "vgm2fur"
path = "src/bin/vgm2fur.rs"

[[bin]]
name = "parity_dump"
path = "src/bin/parity_dump.rs"

[dependencies]
flate2 = "1"
indexmap = "2"
glob = "0.3"
serde_json = "1"

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'unwind'    # use 'abort' for immediate termination
strip = true        # Strip symbols from binary*

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
] }
